name: Build Signed APK (manual)

# Manual-only, no-Release-step build for a physical smoke test of a real release-signed
# artifact BEFORE any public GitHub Release is cut. Uploads the APK as a workflow artifact
# only. Does not create a tag or a Release.
#
# This workflow is plumbing prepared ahead of a future "Gate" mission: it does not itself
# hold or generate any secret. It requires RELEASE_STORE_BASE64, RELEASE_STORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD and RELEASE_CERT_SHA256 to already exist as
# repository secrets. If any are missing, the job fails clearly at the verification step
# below rather than silently falling back to an unsigned (or debug-signed) build mislabeled
# as a signed release. Signer identity is verified cryptographically by comparing the built
# APK's certificate SHA-256 fingerprint against RELEASE_CERT_SHA256 — the same contract and
# the same verification script (.github/scripts/verify-apk-signer.sh) used by the public
# release workflow.

on:
  workflow_dispatch:
    inputs:
      versionTag:
        description: "Version tag to embed in the build (e.g. v20260904), optional"
        required: false
        default: ""

jobs:
  build-signed:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify release signing secrets are configured
        env:
          HAS_STORE: ${{ secrets.RELEASE_STORE_BASE64 }}
          HAS_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          HAS_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          HAS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          HAS_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          missing=""
          [ -z "$HAS_STORE" ] && missing="$missing RELEASE_STORE_BASE64"
          [ -z "$HAS_STORE_PASSWORD" ] && missing="$missing RELEASE_STORE_PASSWORD"
          [ -z "$HAS_KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$HAS_KEY_PASSWORD" ] && missing="$missing RELEASE_KEY_PASSWORD"
          [ -z "$HAS_CERT_SHA256" ] && missing="$missing RELEASE_CERT_SHA256"
          if [ -n "$missing" ]; then
            echo "::error::Release signing secrets not configured yet:$missing"
            echo "This is expected until a future Gate mission generates and stores a real"
            echo "release key. Refusing to produce an APK that would be mislabeled as signed."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_STORE_BASE64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: echo "$RELEASE_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK (real release signing)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export RELEASE_STORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease -PversionTag=${{ inputs.versionTag }}

      - name: Verify the APK is signed with the expected release certificate
        env:
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          chmod +x .github/scripts/verify-apk-signer.sh
          .github/scripts/verify-apk-signer.sh \
            app/build/outputs/apk/release/app-release.apk \
            "$RELEASE_CERT_SHA256"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: optiqon-voice-signed-smoke-build
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
