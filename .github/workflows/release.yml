name: Release APK

# Publishes a public GitHub Release. This workflow must never be able to publish a
# debug-signed APK: it requires the same RELEASE_STORE_BASE64, RELEASE_STORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD and RELEASE_CERT_SHA256 secrets as the manual
# signed-smoke build (build-signed-apk.yml), fails clearly before building if any are
# missing, and verifies the built APK's signer certificate fingerprint (via the shared
# .github/scripts/verify-apk-signer.sh) before the release step runs. Until a future Gate
# mission provisions those secrets, pushing a tag here fails the workflow instead of
# publishing anything — a debug-signed fallback can never reach a public Release.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify release signing secrets are configured
        env:
          HAS_STORE: ${{ secrets.RELEASE_STORE_BASE64 }}
          HAS_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          HAS_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          HAS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          HAS_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          missing=""
          [ -z "$HAS_STORE" ] && missing="$missing RELEASE_STORE_BASE64"
          [ -z "$HAS_STORE_PASSWORD" ] && missing="$missing RELEASE_STORE_PASSWORD"
          [ -z "$HAS_KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$HAS_KEY_PASSWORD" ] && missing="$missing RELEASE_KEY_PASSWORD"
          [ -z "$HAS_CERT_SHA256" ] && missing="$missing RELEASE_CERT_SHA256"
          if [ -n "$missing" ]; then
            echo "::error::Release signing secrets not configured yet:$missing"
            echo "This workflow refuses to build or publish a release APK without complete"
            echo "production release-signing configuration. A debug-signed build must never"
            echo "reach a public GitHub Release. This is expected until a future Gate mission"
            echo "generates and stores a real release key, and it is not a bug."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_STORE_BASE64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: echo "$RELEASE_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK (real release signing)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export RELEASE_STORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease -PversionTag=${{ github.ref_name }}

      - name: Verify the APK is signed with the expected release certificate
        env:
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          chmod +x .github/scripts/verify-apk-signer.sh
          .github/scripts/verify-apk-signer.sh \
            app/build/outputs/apk/release/app-release.apk \
            "$RELEASE_CERT_SHA256"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk optiqon-voice-${{ github.ref_name }}.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: optiqon-voice-${{ github.ref_name }}.apk
          generate_release_notes: true
